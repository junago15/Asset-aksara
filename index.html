<!DOCTYPE html> 
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Email Terkonfirmasi — mart.aksaramp.my.id</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #f0f4fa 0%, #e6ecf3 100%);
            padding: 1rem;
        }

        .card {
            max-width: 440px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.2), 0 4px 12px rgba(0, 0, 0, 0.05);
            padding: 2rem 1.8rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.2s ease;
        }

        /* ikon centang lebih kecil */
        .icon-circle {
            width: 64px;
            height: 64px;
            background: #1e8b4c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem;
            box-shadow: 0 10px 20px -6px rgba(30, 139, 76, 0.3);
        }

        .icon-circle svg {
            width: 36px;
            height: 36px;
            fill: white;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #0a1929;
            margin-bottom: 0.3rem;
        }

        .subtitle {
            font-size: 1rem;
            color: #2e405b;
            margin-bottom: 1.5rem;
            font-weight: 400;
            line-height: 1.4;
            padding: 0 0.5rem;
        }

        .message-box {
            background: #f0f9f4;
            border-radius: 20px;
            padding: 1rem 0.8rem;
            margin-bottom: 1.8rem;
            border: 1px solid rgba(30, 139, 76, 0.2);
        }

        .message-box p {
            color: #0b3b2a;
            font-size: 0.95rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .message-box span {
            background: #d1e7dd;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #0c4e2d;
        }

        /* tombol lebih kecil */
        .btn {
            display: inline-block;
            background: #0a66c2;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            padding: 0.7rem 2rem;
            border-radius: 50px;
            box-shadow: 0 6px 16px -5px rgba(10, 102, 194, 0.4);
            transition: background 0.15s, box-shadow 0.2s, transform 0.1s;
            border: none;
            cursor: pointer;
            letter-spacing: 0.3px;
            margin: 0.5rem 0 0.8rem;
        }

        .btn:hover {
            background: #054a94;
            box-shadow: 0 10px 22px -8px rgba(10, 102, 194, 0.6);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .url-hint {
            color: #4b5e77;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .url-hint code {
            background: rgba(0, 0, 0, 0.04);
            padding: 0.2rem 0.5rem;
            border-radius: 24px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            color: #10355e;
            font-size: 0.8rem;
            border: 1px solid rgba(0,0,0,0.05);
        }

        /* countdown style */
        .countdown-text {
            font-size: 0.9rem;
            color: #2e405b;
            background: rgba(10, 102, 194, 0.05);
            padding: 0.5rem 1rem;
            border-radius: 40px;
            display: inline-block;
            margin: 0.5rem 0 0.2rem;
            border: 1px solid rgba(10, 102, 194, 0.15);
        }

        .countdown-text span {
            font-weight: 700;
            color: #0a66c2;
            background: white;
            padding: 0.1rem 0.4rem;
            border-radius: 20px;
            margin-left: 0.2rem;
            font-size: 1rem;
        }

        .footer-note {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #6d7b91;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding-top: 1rem;
        }

        .footer-note a {
            color: #0a66c2;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Ikon centang hijau ukuran diperkecil -->
        <div class="icon-circle">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
            </svg>
        </div>

        <h1>Konfirmasi berhasil</h1>
        <div class="subtitle">
            Email Anda telah diverifikasi
        </div>

        <div class="message-box">
            <p>
                ✅ Akun Anda sudah aktif. 
                <span>selamat datang</span>
            </p>
        </div>

        <!-- Tombol login (ukuran lebih kecil) -->
        <a href="https://mart.aksaramp.my.id" class="btn" id="loginBtn" rel="noopener noreferrer">
            ⇾  Login ke akun  ⇽
        </a>

        <div class="url-hint">
            <span>🔐 Tujuan:</span>
            <code>mart.aksaramp.my.id</code>
        </div>

        <!-- Countdown dan redirect otomatis -->
        <div class="countdown-text" id="countdownDisplay">
            ⏳ Dialihkan dalam <span id="seconds">5</span> detik
        </div>

        <div class="footer-note">
            <p>•  Atau <a href="https://mart.aksaramp.my.id" id="directLink">klik di sini</a> jika tidak ingin menunggu  •</p>
            <p style="margin-top: 0.5rem; opacity: 0.7;">Terima kasih telah bergabung</p>
        </div>
    </div>

    <script>
        (function() {
            // Tujuan redirect
            const targetUrl = "https://mart.aksaramp.my.id";
            
            // Waktu tunggu (detik) - bisa diubah antara 3-5
            let countdownSeconds = 5;   // ubah ke 3 jika ingin lebih cepat
            
            // Elemen countdown
            const secondsSpan = document.getElementById('seconds');
            const countdownDisplay = document.getElementById('countdownDisplay');
            
            // Tombol / link untuk membatalkan timeout secara implisit
            const loginBtn = document.getElementById('loginBtn');
            const directLink = document.getElementById('directLink');
            
            // Variabel untuk timeout
            let redirectTimeout;

            // Fungsi untuk memperbarui tampilan hitung mundur
            function updateCountdown() {
                if (secondsSpan) {
                    secondsSpan.textContent = countdownSeconds;
                }
            }

            // Fungsi redirect
            function doRedirect() {
                window.location.href = targetUrl;
            }

            // Mulai hitung mundur
            function startCountdown() {
                // Jika sudah 0, redirect
                if (countdownSeconds <= 0) {
                    doRedirect();
                    return;
                }

                // Kurangi detik setiap 1 detik
                redirectTimeout = setInterval(function() {
                    countdownSeconds -= 1;
                    updateCountdown();

                    if (countdownSeconds <= 0) {
                        clearInterval(redirectTimeout);
                        doRedirect();
                    }
                }, 1000);
            }

            // Batalkan redirect jika pengguna mengklik tombol atau link
            function cancelRedirect() {
                if (redirectTimeout) {
                    clearInterval(redirectTimeout);
                    redirectTimeout = null;
                }
                // Opsional: ubah teks countdown
                if (countdownDisplay) {
                    countdownDisplay.innerHTML = '⏳ Pengalihan dibatalkan';
                }
            }

            // Tambahkan event listener ke tombol dan link
            if (loginBtn) {
                loginBtn.addEventListener('click', function(e) {
                    // Jangan batalkan default, tetap lanjut ke href
                    // Tapi hentikan countdown
                    cancelRedirect();
                });
            }

            if (directLink) {
                directLink.addEventListener('click', function(e) {
                    cancelRedirect();
                    // link akan bekerja normal
                });
            }

            // Inisialisasi tampilan dan mulai countdown
            updateCountdown();
            startCountdown();

            // Opsional: Jika pengguna meninggalkan halaman, tidak masalah
        })();
    </script>
</body>
</html>

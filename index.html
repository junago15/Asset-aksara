<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Email Terkonfirmasi — mart.aksaramp.my.id</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #f0f4fa 0%, #e6ecf3 100%);
            padding: 1rem;
        }

        .card {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 20, 40, 0.25), 0 4px 12px rgba(0, 0, 0, 0.05);
            padding: 2.5rem 2rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: scale(1.01);
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background: #1e8b4c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 12px 24px -8px rgba(30, 139, 76, 0.3);
        }

        .icon-circle svg {
            width: 44px;
            height: 44px;
            fill: white;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #0a1929;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #2e405b;
            margin-bottom: 2rem;
            font-weight: 400;
            line-height: 1.5;
            padding: 0 0.5rem;
        }

        .message-box {
            background: #f0f9f4;
            border-radius: 24px;
            padding: 1.25rem 1rem;
            margin-bottom: 2.2rem;
            border: 1px solid rgba(30, 139, 76, 0.2);
        }

        .message-box p {
            color: #0b3b2a;
            font-size: 1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .message-box span {
            background: #d1e7dd;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #0c4e2d;
        }

        .btn {
            display: inline-block;
            background: #0a66c2;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.2rem;
            padding: 1rem 2.8rem;
            border-radius: 60px;
            box-shadow: 0 8px 20px -6px rgba(10, 102, 194, 0.4);
            transition: background 0.15s, box-shadow 0.2s, transform 0.1s;
            border: none;
            cursor: pointer;
            letter-spacing: 0.3px;
            margin-bottom: 1rem;
        }

        .btn:hover {
            background: #054a94;
            box-shadow: 0 12px 28px -8px rgba(10, 102, 194, 0.6);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .url-hint {
            color: #4b5e77;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            flex-wrap: wrap;
        }

        .url-hint code {
            background: rgba(0, 0, 0, 0.04);
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            color: #10355e;
            font-size: 0.85rem;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #6d7b91;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding-top: 1.2rem;
        }

        .footer-note a {
            color: #0a66c2;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Ikon centang hijau -->
        <div class="icon-circle">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
            </svg>
        </div>

        <h1>Konfirmasi berhasil</h1>
        <div class="subtitle">
            Email Anda telah diverifikasi
        </div>

        <div class="message-box">
            <p>
                ✅ Akun Anda sudah aktif. 
                <span>selamat datang</span>
            </p>
        </div>

        <!-- Tombol langsung ke login / halaman utama mart.aksaramp.my.id -->
        <a href="https://mart.aksaramp.my.id" class="btn" rel="noopener noreferrer">
            ⇾  Login ke akun  ⇽
        </a>

        <div class="url-hint">
            <span>🔐 Anda akan diarahkan ke</span>
            <code>mart.aksaramp.my.id</code>
        </div>

        <div class="footer-note">
            <p>•  Jika tidak diarahkan secara otomatis, <a href="https://mart.aksaramp.my.id">klik di sini</a>  •</p>
            <p style="margin-top: 0.5rem; opacity: 0.7;">Terima kasih telah bergabung</p>
        </div>
    </div>

    <!-- opsional: perlindungan jika pengguna mengklik kembali via tombol browser, tetap tampil rapi -->
</body>
</html>
